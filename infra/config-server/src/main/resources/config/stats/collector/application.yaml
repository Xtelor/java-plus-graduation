server:
  port: 0

grpc:
  server:
    port: 0

collector:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      user-actions: stats.user-actions.v1

logging:
  level:
    ru.practicum: DEBUG

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 2