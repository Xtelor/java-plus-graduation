services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=ewm-stats
      - POSTGRES_USER=stat
      - POSTGRES_PASSWORD=stat
    volumes:
      - stats-postgres:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stat -d ewm-stats" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service-db:
    image: postgres:16.1
    container_name: postgres-ewm-user-service-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=ewm-user-service
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
    volumes:
      - user-service-postgres:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ewm-user-service" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  category-service-db:
      image: postgres:16.1
      container_name: postgres-ewm-category-service-db
      ports:
        - "5435:5432"
      environment:
        - POSTGRES_DB=ewm-category-service
        - POSTGRES_USER=category
        - POSTGRES_PASSWORD=category
      volumes:
        - category-service-postgres:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U category -d ewm-category-service" ]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  comment-service-db:
      image: postgres:16.1
      container_name: postgres-ewm-comment-service-db
      ports:
        - "5436:5432"
      environment:
        - POSTGRES_DB=ewm-comment-service
        - POSTGRES_USER=comment
        - POSTGRES_PASSWORD=comment
      volumes:
        - comment-service-postgres:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U comment -d ewm-comment-service" ]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  compilation-service-db:
      image: postgres:16.1
      container_name: postgres-ewm-compilation-service-db
      ports:
        - "5437:5432"
      environment:
        - POSTGRES_DB=ewm-compilation-service
        - POSTGRES_USER=compilation
        - POSTGRES_PASSWORD=compilation
      volumes:
        - compilation-service-postgres:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U compilation -d ewm-compilation-service" ]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  event-service-db:
      image: postgres:16.1
      container_name: postgres-ewm-event-service-db
      ports:
        - "5438:5432"
      environment:
        - POSTGRES_DB=ewm-event-service
        - POSTGRES_USER=event
        - POSTGRES_PASSWORD=event
      volumes:
        - event-service-postgres:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U event -d ewm-event-service" ]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  request-service-db:
      image: postgres:16.1
      container_name: postgres-ewm-request-service-db
      ports:
        - "5439:5432"
      environment:
        - POSTGRES_DB=ewm-request-service
        - POSTGRES_USER=request
        - POSTGRES_PASSWORD=request
      volumes:
        - request-service-postgres:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U request -d ewm-request-service" ]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: >
      bash -c "
        cub kafka-ready -b kafka:29092 1 20 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic stats.user-actions.v1 --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic stats.events-similarity.v1 --partitions 3 --replication-factor 1
      "

volumes:
    stats-postgres:
    user-service-postgres:
    category-service-postgres:
    comment-service-postgres:
    compilation-service-postgres:
    event-service-postgres:
    request-service-postgres: